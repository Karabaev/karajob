services:
  karajob:
    build:
      context: .
      args:
        SOURCE_REVISION: ${KARAJOB_SOURCE_REVISION:-}
    image: ${KARAJOB_IMAGE:-karajob}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${KARAJOB_PORT:-8080}:8080"
    volumes:
      - "${KARAJOB_DATA_DIR:-./data}:/data"
