# Server compose file: runs the image published by CI, no sources and no build on the server.
# Put it next to .env (see .env.example in this folder) and the data folder. See docs/deploy.md.
services:
  karajob:
    image: ghcr.io/karabaev/karajob:${KARAJOB_TAG:?Set KARAJOB_TAG in .env to an image tag, e.g. sha-<full commit sha>}
    restart: unless-stopped
    env_file: .env
    environment:
      # TLS is terminated by the router; trust its X-Forwarded-* headers (see docs/deploy.md).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "${KARAJOB_PORT:-8080}:8080"
    volumes:
      - "${KARAJOB_DATA_DIR:-./data}:/data"
